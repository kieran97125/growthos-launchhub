name: LaunchHub Attribution Acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attribution-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      LAUNCHHUB_E2E_FIXTURES: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run attribution acceptance
        run: npm run test:e2e:attribution

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launchhub-attribution-report
          path: playwright-report/
          retention-days: 14

      - name: Upload failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: launchhub-attribution-failures
          path: test-results/
          retention-days: 14
